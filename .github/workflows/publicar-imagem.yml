# ---------------------------------------------------------------------------
# Constroi e publica a imagem do HADDOCK3 no GHCR.
#
# POR QUE EXISTE
#   1. Publicar daqui usa o GITHUB_TOKEN da propria Action: nao depende de
#      token pessoal na maquina de ninguem, nem de `gh auth refresh`.
#   2. Quando a imagem e enviada por uma Action DESTE repositorio, o GitHub liga
#      o pacote ao repositorio sozinho. Enviada da maquina do autor, o pacote
#      fica solto na conta mesmo com o label `org.opencontainers.image.source`.
#   3. O build acontece nos runners, nao no computador de quem programa.
#
# QUANDO RODA
#   A imagem depende SO do Dockerfile (ela nao copia nada do repositorio), entao
#   nao faz sentido reconstruir a cada commit: roda quando o Dockerfile ou este
#   arquivo mudam, quando uma release e publicada, e a mao pelo botao
#   "Run workflow".
# ---------------------------------------------------------------------------
name: Publicar imagem do HADDOCK3

on:
  push:
    branches: [main]
    paths:
      - "docker/Dockerfile.haddock3"
      - ".github/workflows/publicar-imagem.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      versao:
        description: "Tag de versao (vazio = le do LABEL image.version do Dockerfile)"
        required: false
        type: string

# Menor permissao que faz o trabalho: ler o codigo e escrever pacote.
permissions:
  contents: read
  packages: write

# Dois pushes seguidos nao disputam a mesma tag.
concurrency:
  group: imagem-haddock3-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGEM: ghcr.io/${{ github.repository_owner }}/ppi-haddock3

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # TAG DE VERSAO SO SAI DE REF IMUTAVEL. Por que: `workflow_dispatch` e
      # `push` fazem checkout de um BRANCH, que se move. Marcar `:1.2.3` a partir
      # de branch faz a tag de versao servir, amanha, conteudo diferente do que
      # ela servia hoje -- divergindo do git, da release e de um eventual DOI.
      # (Armadilha relatada pela sessao do CoIP-MS, que a viveu: disparou a mao
      # para corrigir um rotulo e a tag de versao passou a servir conteudo mais
      # novo que a release.)
      #
      # Regra: `github.ref_type == 'tag'` -> publica `:<versao>` e `:latest`.
      #        branch -> publica `:latest` e `:sha-<curto>`, nunca a versao.
      # `workflow_dispatch` aceita escolher uma TAG como ref: e assim que se
      # republica uma versao de proposito.
      - name: Resolver versao e tags
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          curto="${GITHUB_SHA:0:7}"
          imutavel="false"
          [ "${{ github.ref_type }}" = "tag" ] && imutavel="true"

          entrada="${{ inputs.versao }}"
          if [ -n "$entrada" ]; then
            versao="$entrada"
            origem="entrada do workflow_dispatch"
          elif [ "$imutavel" = "true" ]; then
            versao="${GITHUB_REF_NAME#v}"
            origem="tag git ${GITHUB_REF_NAME}"
          else
            # Fonte unica: o proprio LABEL do Dockerfile.
            versao="$(sed -n 's/.*org\.opencontainers\.image\.version="\([^"]*\)".*/\1/p' \
                      docker/Dockerfile.haddock3 | head -1)"
            origem="LABEL image.version do Dockerfile"
          fi
          if [ -z "$versao" ]; then
            echo "::error::nao consegui resolver a versao da imagem"
            exit 1
          fi

          if [ -n "$entrada" ] && [ "$imutavel" != "true" ]; then
            echo "::error::versao '$entrada' pedida a partir de um branch \
          (${GITHUB_REF_NAME}), que e ref MOVEL. Marcar uma tag de versao daqui \
          faria ela servir conteudo diferente amanha. Dispare o workflow \
          escolhendo a TAG da versao como ref, ou publique uma release."
            exit 1
          fi

          if [ "$imutavel" = "true" ]; then
            tags="${IMAGEM}:${versao}"$'\n'"${IMAGEM}:latest"
            publica_versao="true"
          else
            tags="${IMAGEM}:latest"$'\n'"${IMAGEM}:sha-${curto}"
            publica_versao="false"
          fi

          {
            echo "versao=$versao"
            echo "curto=$curto"
            echo "publica_versao=$publica_versao"
            echo "principal=$(echo "$tags" | head -1)"
            echo "tags<<FIM"
            echo "$tags"
            echo "FIM"
          } >> "$GITHUB_OUTPUT"

          echo "Versao: $versao (de: $origem)"
          echo "Ref: ${GITHUB_REF_NAME} (${{ github.ref_type }}), imutavel=$imutavel"
          echo "Tags a publicar:"; echo "$tags" | sed 's/^/  /'

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3.7.1

      # Uma arquitetura so, de proposito: o Dockerfile confere em build time que
      # o binario do CNS da arquitetura EXECUTA, e cruzar para arm64 por emulacao
      # levaria dezenas de minutos para um usuario que nao existe hoje.
      - name: Construir (sem publicar ainda)
        uses: docker/build-push-action@v6.9.0
        with:
          context: .
          file: docker/Dockerfile.haddock3
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.ver.outputs.tags }}
          # O SHA real do commit que gerou a imagem. Nao fica no Dockerfile
          # porque la ele envelheceria no commit seguinte.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A regra do repositorio e que a imagem nao carrega arquivo do projeto nem
      # dado: o Dockerfile nao tem COPY nem ADD. Aqui isso deixa de ser promessa
      # e vira teste -- se algum dia alguem acrescentar um COPY, o build para.
      - name: Conferir que a imagem nao carrega arquivo do repositorio
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker create ${{ steps.ver.outputs.principal }})"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          # O script vai para um ARQUIVO, e so depois o tar e canalizado para ele.
          # `docker export ... | python3 - <<'PY'` NAO funciona: o heredoc
          # substitui o stdin, entao o Python le o PROGRAMA do heredoc e o
          # `sys.stdin.buffer` dele e o heredoc ja consumido -- o tar nunca
          # chega, e tarfile levanta "empty file".
          cat > /tmp/conferir_imagem.py <<'PY'
          import sys, tarfile
          SISTEMA = ("usr/", "lib/", "lib64/", "bin/", "sbin/", "etc/", "var/",
                     "opt/", "srv/", "root/", "home/", "tmp/", "proc/", "sys/",
                     "dev/", "run/", "media/", "mnt/", "boot/")
          # O Docker cria este arquivo vazio sozinho em toda imagem.
          PERMITIDOS = {".dockerenv"}
          intrusos, total = [], 0
          with tarfile.open(fileobj=sys.stdin.buffer, mode="r|*") as tf:
              for m in tf:
                  total += 1
                  if not m.isfile():
                      continue
                  # CUIDADO: `lstrip("./")` remove CARACTERES, nao prefixo --
                  # transformaria ".dockerenv" em "dockerenv" e a lista de
                  # permitidos nunca casaria.
                  nome = m.name[2:] if m.name.startswith("./") else m.name
                  if nome.startswith(SISTEMA) or nome in PERMITIDOS:
                      continue
                  intrusos.append((nome, m.size))
          print(f"membros no tar: {total}")
          if intrusos:
              print("::error::a imagem carrega arquivo que nao e da imagem base:")
              for nome, tam in intrusos[:40]:
                  print(f"  {tam:>10}  {nome}")
              sys.exit(1)
          print("ok: nenhum arquivo do repositorio dentro da imagem")
          PY

          docker export "$cid" | python3 /tmp/conferir_imagem.py

      - name: Entrar no GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar
        shell: bash
        run: |
          set -euo pipefail
          tags="${{ steps.ver.outputs.tags }}"
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            docker push "$t"
          done <<< "$tags"

          {
            echo "### Imagem publicada"
            echo
            echo '```'
            while IFS= read -r t; do
              [ -n "$t" ] || continue
              echo "docker pull $t"
            done <<< "$tags"
            echo '```'
            echo
            echo "Commit: \`${{ github.sha }}\`"
            if [ "${{ steps.ver.outputs.publica_versao }}" != "true" ]; then
              echo
              echo "> Build a partir de um branch, entao a tag de versao"
              echo "> \`${{ steps.ver.outputs.versao }}\` **nao** foi publicada: ela so sai de"
              echo "> uma tag git, para nunca servir conteudo diferente do que serviu"
              echo "> quando a versao foi cortada."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
